<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paulette Naranjo — Portfolio</title>
<meta name="description" content="Portfolio de Paulette Naranjo, Marketing & Data Analyst en Madrid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  :root{
    --bg:#1d4bff;
    --bg-deep:#1236d6;
    --ink:#ffffff;
    --glass:rgba(9,14,38,.64);
    --line:rgba(255,255,255,.13);
    --acc:#ff3b30;
    --acc-ui:#ff6b62;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(120% 90% at 50% 35%, #2f5cff 0%, var(--bg) 45%, var(--bg-deep) 100%)}
  .font-display{font-family:'Archivo Black',Impact,'Arial Black',sans-serif;letter-spacing:-.01em}

  #bigword{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;
    pointer-events:none;user-select:none}
  #bigword span{font-family:'Archivo Black',Impact,'Arial Black',sans-serif;display:inline-block;font-size:18vw;line-height:.8;
    letter-spacing:-.045em;color:#fff;transform:translateY(-14vh);white-space:nowrap;
    text-shadow:0 .04em 0 rgba(0,0,0,.08)}
  #scene{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:manipulation}

  .hud{position:fixed;z-index:5;pointer-events:none}
  .hud *{pointer-events:auto}
  #top{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  #bottom{bottom:0;left:0;right:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px}

  .navbtn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .85rem;border-radius:12px;
    background:rgba(8,16,60,.28);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);font-weight:600;font-size:.8rem;color:#fff;cursor:pointer;transition:background .2s, transform .2s}
  .navbtn:hover,.navbtn.is-hot{background:rgba(255,255,255,.18);transform:translateY(-2px)}
  .navbtn i{width:10px;height:10px;border-radius:2px;display:block}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:3px}

  #tip{position:fixed;z-index:6;pointer-events:none;padding:.4rem .65rem;border-radius:8px;background:#fff;color:#0a1440;
    font-weight:700;font-size:.78rem;opacity:0;transform:translate(14px,14px)}

  /* Modal */
  #modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    pointer-events:none;opacity:0;background:rgba(6,14,60,.25)}
  #modal.open{pointer-events:auto}
  .glass{background:var(--glass);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
    border:1px solid var(--line);box-shadow:0 40px 100px rgba(0,0,30,.5), inset 0 1px 0 rgba(255,255,255,.08)}
  #panel{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:22px;overflow:hidden}
  #panelHead{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 16px 22px;
    background:repeating-linear-gradient(90deg, var(--acc) 0 22px, color-mix(in srgb, var(--acc) 82%, #000) 22px 30px)}
  #panelHead h2{margin:0;font-size:clamp(1.2rem,3vw,1.6rem);color:var(--head-ink,#fff)}
  #panelHead small{display:block;font-weight:600;font-size:.72rem;opacity:.8;color:var(--head-ink,#fff)}
  #closeBtn{width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;
    display:grid;place-items:center;flex:none;transition:background .2s, transform .2s}
  #closeBtn:hover{background:rgba(0,0,0,.6);transform:rotate(90deg)}
  #content{overflow:auto;padding:24px;overscroll-behavior:contain}
  @media (min-width:768px){#content{padding:30px 34px 34px}}

  .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.32rem .65rem;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);font-size:.76rem;font-weight:500;color:rgba(255,255,255,.9)}
  .tile{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px}
  .acc{color:var(--acc-ui)}
  .lead{color:rgba(255,255,255,.78);line-height:1.6}
  .muted{color:rgba(255,255,255,.58)}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar b{display:block;height:100%;background:var(--acc-ui);border-radius:6px}

  details.proj{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:16px;transition:background .2s,border-color .2s}
  details.proj[open]{background:rgba(255,255,255,.08);border-color:color-mix(in srgb,var(--acc-ui) 55%, transparent)}
  details.proj summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
  details.proj summary::-webkit-details-marker{display:none}
  details.proj .plus{flex:none;width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;transition:transform .25s}
  details.proj[open] .plus{transform:rotate(45deg);background:var(--acc-ui);border-color:transparent;color:#071040}
  details.proj .body{padding:0 18px 18px 18px}

  .step{position:relative;padding-left:64px;padding-bottom:26px}
  .step:last-child{padding-bottom:0}
  .step::before{content:"";position:absolute;left:21px;top:46px;bottom:4px;width:2px;background:linear-gradient(var(--acc-ui),transparent)}
  .step:last-child::before{display:none}
  .step .num{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:'Archivo Black',Impact,sans-serif}

  .field{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:.75rem .9rem;color:#fff;font:inherit}
  .field::placeholder{color:rgba(255,255,255,.45)}
  .field:focus{border-color:var(--acc-ui);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc-ui) 30%,transparent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.1rem;border-radius:12px;border:0;font-weight:700;cursor:pointer;background:var(--acc-ui);color:#0a0f2c;transition:transform .2s, filter .2s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16)}
  .icon-link{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);transition:background .2s, transform .2s}
  .icon-link:hover{background:var(--acc-ui);color:#0a0f2c;transform:translateY(-3px)}

  #loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .6s}
  #loader p{font-family:'Archivo Black',Impact,sans-serif;font-size:1.1rem}
  #loader .track{width:160px;height:6px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:12px}
  #loader .track b{display:block;height:100%;width:40%;background:#fff;border-radius:6px;animation:load 1s ease-in-out infinite}
  .portrait{width:min(200px,60%);aspect-ratio:4/5;object-fit:cover;object-position:48% 32%;border-radius:18px;border:3px solid var(--acc);box-shadow:0 18px 40px rgba(0,0,0,.35);flex:none}
  .vid{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:0;padding:0;cursor:pointer}
  .vid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s, opacity .3s;opacity:.9}
  .vid:hover img{transform:scale(1.04);opacity:1}
  .vid .play{position:absolute;inset:0;display:grid;place-items:center}
  .vid .play span{width:64px;height:64px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .25s}
  .vid:hover .play span{transform:scale(1.1)}
  .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .reel{width:100%;max-width:340px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#fff;border:0}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

  @media (prefers-reduced-motion: reduce){ #loader .track b{animation:none} }
  @media (max-width:640px){ #bigword span{transform:translateY(-22vh)} .navbtn{font-size:.72rem;padding:.48rem .65rem} #hint{display:none} }
</style>
</head>
<body>

<div id="loader"><div class="text-center"><p>Abriendo el puerto…</p><div class="track"><b></b></div></div></div>

<div id="bigword" aria-hidden="true"><span>PORTFOLIO</span></div>
<canvas id="scene" aria-label="Escena 3D con seis contenedores. Usa los botones inferiores para abrir cada sección."></canvas>

<header id="top" class="hud">
  <div>
    <p class="font-display text-lg md:text-xl leading-none">Paulette Naranjo</p>
    <p class="text-xs md:text-sm text-white/80 mt-1">Marketing &amp; Data Analyst en Madrid</p>
  </div>
  <div class="flex items-center gap-2 text-xs md:text-sm font-semibold bg-white text-[#0a1a6b] rounded-full px-3 py-1.5">
    <span class="w-2 h-2 rounded-full bg-[#16c266] inline-block"></span> Disponible ya
  </div>
</header>

<div id="tip"></div>

<nav id="bottom" class="hud" aria-label="Secciones">
  <p id="hint" class="text-sm text-white/85 font-medium">Elige un contenedor y la grúa te lo trae.</p>
  <div id="nav" class="flex flex-wrap justify-center gap-2"></div>
</nav>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div id="panel" class="glass">
    <div id="panelHead">
      <div><small id="modalCode"></small><h2 id="modalTitle" class="font-display"></h2></div>
      <button id="closeBtn" aria-label="Cerrar y devolver el contenedor">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
(async function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);

  /* ---------- Datos ---------- */
  /* Formulario: FormSubmit reenvía cada mensaje a este correo.
     Tras activarlo, puedes cambiar el email por el alias aleatorio que te dan. */
  const FORM_ENDPOINT = 'https://formsubmit.co/ajax/ldrpaulette@gmail.com';

  const SECTIONS = [
    { id:'about',    label:'ABOUT ME',  color:'#ff3b30', ui:'#ff6b62', code:'PNRU 100001 · 22G1', ink:'#fff' },
    { id:'work',     label:'THE WORK',  color:'#0d2a9c', ui:'#6f9bff', code:'PNBU 200002 · 45G1', ink:'#fff' },
    { id:'services', label:'WHAT I DO', color:'#ffc400', ui:'#ffd43b', code:'PNYU 300003 · 22G1', ink:'#14130a' },
    { id:'process',  label:'PROCESS',   color:'#ff7a00', ui:'#ff9a3c', code:'PNOU 400004 · 22G1', ink:'#fff' },
    { id:'toolkit',  label:'SKILLS',   color:'#12b85c', ui:'#3ddc84', code:'PNGU 500005 · 45G1', ink:'#fff' },
    { id:'contact',  label:'SAY HELLO', color:'#8b3dff', ui:'#b07cff', code:'PNPU 600006 · 22G1', ink:'#fff' },
  ];

  const ICON = {
    pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    mail:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
    phone:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    linkedin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>',
    github:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>',
    plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  };
  const chips = arr => arr.map(t => `<span class="chip">${t}</span>`).join('');

  const PROJECTS = [
    { g:'mkt', t:'Campañas 360° de Maltín Polar', tools:['Campañas 360°','Coordinación de agencias','Trade marketing'], m:'+6', ml:'campañas 360° a nivel nacional',
      d:'Coordinación de más de 6 campañas 360°: del brief con la agencia creativa a la ejecución en más de 90.000 puntos de venta, con medios, digital, trade y activaciones contando la misma historia.' },
    { g:'mkt', t:'Activaciones de marca', tools:['Eventos','Trade marketing','Logística'], m:'+50', ml:'activaciones, 98% a tiempo',
      d:'Gestión de más de 50 activaciones de marca, con un 98% entregadas en fecha. La marca en la calle, cerca del consumidor.' },
    { g:'mkt', t:'Comunidad TikTok de Maltín Polar', tools:['Estrategia de contenido','TikTok','Agencia Capitolio'], m:'+471%', ml:'de 7.000 a +40.000 seguidores',
      d:'Estrategia de contenido junto a la agencia Capitolio que llevó la cuenta de 7.000 a más de 40.000 seguidores.' },
    { g:'mkt', t:'Programa de influencers', tools:['Selección de perfiles','Negociación','Contratos','Presupuestos'], m:'+100', ml:'influencers en 6 campañas',
      d:'Gestión de más de 100 influencers a lo largo de 6 campañas: selección, negociación, contratos y control de presupuestos.' },
    { g:'mkt', t:'Paid social en Meta Ads', tools:['Meta Ads','Segmentación','Optimización de inversión'], m:'Meta', ml:'alcance y notoriedad',
      d:'Segmentación de audiencias y optimización de la inversión con foco en alcance y notoriedad de marca.' },
    { g:'mkt', t:'Campañas CRM multicanal', tools:['Salesforce Marketing Cloud','Email','SMS','WhatsApp'], m:'3', ml:'canales: email, SMS y WhatsApp',
      d:'Planificación, segmentación y análisis de resultados de campañas CRM para afinar el targeting en cada envío.' },
    { g:'mkt', t:'Patrocinios y RRPP en Baja SAE USB', tools:['Relaciones públicas','Negociación corporativa'], m:'+10K USD', ml:'en patrocinio',
      d:'Más de 30 negociaciones corporativas que se tradujeron en más de 10.000 USD de patrocinio para el equipo de competición.' },
    { g:'data', t:'Reporting de KPIs y dashboards de campañas', tools:['Power BI','Excel','KPIs'], m:'−40%', ml:'tiempo de decisión',
      d:'Reportes de paid social y CRM para Maltín Polar. El equipo pasó a decidir un 40% más rápido con una vista única de CPC, CPM, Reach y ThruPlays.' },
    { g:'data', t:'Estandarización de procesos Lean', tools:['Lean Six Sigma','SOPs'], m:'−27%', ml:'variabilidad',
      d:'Documentación de 3 manuales de procedimientos internos que redujeron la variabilidad de los procesos en un 27%.' },
  ];
  /* Vídeos de campañas: completa title y desc de cada uno y aparecerán debajo del vídeo. */
  const VIDEOS = [
    { type:'yt', id:'Plaf9nPNhEA', title:'', desc:'' },
    { type:'yt', id:'RfQdOnu118s', title:'', desc:'' },
    { type:'yt', id:'LSkn5aKo-_I', title:'', desc:'' },
    { type:'yt', id:'MeCOo8hJdgw', title:'', desc:'' },
    { type:'ig', id:'DUs7acAjd8g', title:'', desc:'' },
  ];
  const caption = v => v.title ? `<p class="font-bold mt-3 leading-snug">${v.title}</p>${v.desc ? `<p class="text-sm lead mt-1">${v.desc}</p>` : ''}` : '';
  const videoBlock = () => {
    const yt = VIDEOS.filter(v => v.type === 'yt'), ig = VIDEOS.filter(v => v.type === 'ig');
    return `
      <h4 class="font-display text-xl mt-9">Campañas en vídeo</h4>
      <p class="lead text-sm mt-1 max-w-2xl">Piezas en las que participé en la conceptualización y la ejecución.</p>
      <div class="grid md:grid-cols-2 gap-4 mt-4">
        ${yt.map(v => `<div><button type="button" class="vid" data-yt="${v.id}" aria-label="Reproducir vídeo${v.title ? ': ' + v.title : ''}">
          <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy">
          <span class="play"><span><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></span>
        </button>${caption(v)}</div>`).join('')}
      </div>
      ${ig.length ? `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
        ${ig.map(v => `<div><iframe class="reel" src="https://www.instagram.com/reel/${v.id}/embed" loading="lazy" allowfullscreen title="Reel de Instagram${v.title ? ': ' + v.title : ''}"></iframe>${caption(v)}</div>`).join('')}
      </div>` : ''}`;
  };
  const projCard = p => `
          <details class="proj">
            <summary>
              <div class="flex-1 min-w-0">
                <p class="font-display text-2xl acc leading-none">${p.m}</p>
                <p class="text-xs muted mt-1">${p.ml}</p>
                <p class="font-bold mt-3 leading-snug">${p.t}</p>
              </div>
              <span class="plus" aria-hidden="true">${ICON.plus}</span>
            </summary>
            <div class="body"><p class="lead text-sm">${p.d}</p><div class="flex flex-wrap gap-1.5 mt-3">${chips(p.tools)}</div></div>
          </details>`;

  const TEMPLATES = {
    about: () => `
      <div class="grid lg:grid-cols-[1.15fr_1fr] gap-8">
        <div>
          <div class="flex flex-col sm:flex-row gap-5 sm:items-end">
            <img src="paulette.jpg" alt="Foto de Paulette Naranjo" class="portrait" onerror="this.remove()">
            <div>
              <h3 class="font-display text-4xl md:text-5xl leading-[.95]">Paulette Naranjo</h3>
              <p class="mt-3 text-lg font-semibold acc">Marketing &amp; Data Analyst</p>
              <p class="muted text-sm">Marketing de marca, campañas y CRM, con los datos como brújula</p>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 mt-4">${chips([ICON.pin+'Madrid, España','Autorizada para trabajar en España','Disponibilidad inmediata'])}</div>
          <p class="lead mt-6">Casi dos años del lado de la marca en Maltín Polar (Empresas Polar, embotelladora de PepsiCo): más de 6 campañas 360°, más de 50 activaciones, más de 100 influencers y una comunidad de TikTok que pasó de 7.000 a más de 40.000 seguidores.</p>
          <p class="lead mt-3">Detrás de cada campaña, datos: CRM en Salesforce Marketing Cloud, reporting en Power BI y Excel, y mejora de procesos con enfoque Lean Six Sigma. Soy Ingeniera de Producción (UNIMET, 8,30/10), con formación en Ingeniería Química (USB) y minors en Marketing Digital, Gestión de Cadena de Suministro y Operaciones.</p>
          <div class="mt-7 space-y-3">
            ${[['Español','Nativo',100],['Inglés','C1',85],['Italiano','Básico',30]].map(([l,n,p])=>`
              <div><div class="flex justify-between text-sm mb-1.5"><span class="font-semibold">${l}</span><span class="muted">${n}</span></div><div class="bar"><b style="width:${p}%"></b></div></div>`).join('')}
          </div>
        </div>
        <div>
          <h4 class="font-display text-xl mb-5">Experiencia</h4>

  const HOOK_TIP = -1.3;                      // punto de enganche (local del gancho)
  const SLING = 1.3;                          // largo de las eslingas
  const HANG = -HOOK_TIP + SLING + H / 2;     // distancia gancho → centro del contenedor
  const TROLLEY_Y = CRANE_Y + .6;
  const DROP_REST = 3, DROP_UP = 4.2;
  const DROP_LOW = TROLLEY_Y - (H / 2 + HANG);
  const GANTRY_HOME = -8.2, FRONT_Z = 6.6;
  gantry.position.z = GANTRY_HOME;

  const drop = { v: DROP_REST }, sway = { v: 0 };

  // Eslingas
  const rigGeo = new THREE.BufferGeometry();
  rigGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(24), 3));
  const rig = new THREE.LineSegments(rigGeo, new THREE.LineBasicMaterial({ color: 0x0a0f24 }));
  rig.visible = false; rig.frustumCulled = false; scene.add(rig);
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => new THREE.Vector3(a * (L / 2 - .2), H / 2, b * (W / 2 - .2)));

  /* ---------- Navegación HUD ---------- */
  const nav = $('#nav');
  SECTIONS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'navbtn'; b.type = 'button';
    b.innerHTML = `<i style="background:${s.color}"></i>${s.label}`;
    b.addEventListener('click', () => openSection(i));
    b.addEventListener('mouseenter', () => !busy && openIdx < 0 && setHover(containers[i]));
    b.addEventListener('mouseleave', () => setHover(null));
    nav.appendChild(b);
  });
  const navBtns = [...nav.children];

  /* ---------- Hover / Raycast ---------- */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  const meshes = containers.map(c => c.mesh);
  const tip = $('#tip');
  let hovered = null, busy = false, openIdx = -1, attached = null;

  function pick(e) {
    ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
    ptr.y = -(e.clientY / window.innerHeight) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(meshes, false)[0];
    return hit ? containers[hit.object.userData.index] : null;
  }
  function setHover(c) {
    if (hovered === c) return;
    if (hovered) {
      const h = hovered;
      if (h !== attached) gsap.to(h.g.position, { y: h.base.y, duration: .35, ease: 'power2.out' });
      h.mats.forEach(m => gsap.to(m, { emissiveIntensity: 0, duration: .3 }));
      gsap.to(h.glow.material, { opacity: 0, duration: .3 });
      navBtns[h.i].classList.remove('is-hot');
    }
    hovered = c;
    if (c) {
      gsap.to(c.g.position, { y: c.base.y + .5, duration: .35, ease: 'power2.out' });
      c.mats.forEach(m => gsap.to(m, { emissiveIntensity: .22, duration: .3 }));
      gsap.to(c.glow.material, { opacity: .95, duration: .3 });
      navBtns[c.i].classList.add('is-hot');
    }
    canvas.style.cursor = c ? 'pointer' : 'default';
  }
  canvas.addEventListener('pointermove', e => {
    const bw = $('#bigword span');
    gsap.to(bw, { x: (e.clientX / window.innerWidth - .5) * -24, duration: .8, ease: 'power2.out' });
    if (busy || openIdx >= 0 || e.pointerType === 'touch') return;
    const c = pick(e);
    setHover(c);
    if (c) { tip.textContent = 'Abrir ' + c.s.label; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.opacity = 1; }
    else tip.style.opacity = 0;
  });
  canvas.addEventListener('pointerleave', () => { setHover(null); tip.style.opacity = 0; });
  canvas.addEventListener('click', e => { const c = pick(e); if (c) openSection(c.i); });

  /* ---------- Secuencias de la grúa ---------- */
  const updProj = () => camera.updateProjectionMatrix();

  function openSection(i) {
    if (busy || openIdx >= 0) return;
    busy = true; openIdx = i; tip.style.opacity = 0;
    setHover(null);
    const c = containers[i];
    gsap.to('#bottom', { opacity: 0, y: 20, duration: .4 });
    const tl = gsap.timeline({ defaults: { ease: 'power2.inOut' } });
    tl.to(gantry.position, { z: c.base.z, duration: 1.1 }, 0)
      .to(trolley.position, { x: c.base.x, duration: 1.1 }, 0)
      .to(sway, { v: .07, duration: .45, yoyo: true, repeat: 1, ease: 'sine.inOut' }, .25)
      .to(drop, { v: DROP_LOW, duration: .9 })
      .add(() => { gsap.killTweensOf(c.g.position); attached = c; rig.visible = true; })
      .to(drop, { v: DROP_UP, duration: 1.05 }, '+=.25')
      .to(gantry.position, { z: FRONT_Z, duration: 1.05 }, '-=.15')
      .to(trolley.position, { x: 0, duration: 1.05 }, '<')
      .to(sway, { v: -.09, duration: .5, yoyo: true, repeat: 1, ease: 'sine.inOut' }, '<')
      .to(camera, { zoom: 1.45, duration: 1, onUpdate: updProj }, '-=.75')
      .to(camFocus, { x: 0, y: 5.4, z: FRONT_Z * .55, duration: 1 }, '<')
      .add(() => { showModal(i); busy = false; }, '-=.35');
  }

  function closeSection() {
    if (busy || openIdx < 0) return;
    busy = true;
    const c = containers[openIdx];
    hideModal();
    const tl = gsap.timeline({ defaults: { ease: 'power2.inOut' } });
    tl.to(camera, { zoom: 1, duration: .9, onUpdate: updProj }, .1)
      .to(camFocus, { x: HOME_FOCUS.x, y: HOME_FOCUS.y, z: HOME_FOCUS.z, duration: .9 }, '<')
      .to(gantry.position, { z: c.base.z, duration: 1.05 }, .2)
      .to(trolley.position, { x: c.base.x, duration: 1.05 }, '<')
      .to(sway, { v: .08, duration: .5, yoyo: true, repeat: 1, ease: 'sine.inOut' }, '<')
      .to(drop, { v: DROP_LOW, duration: .95 })
      .add(() => { attached = null; rig.visible = false; c.g.position.copy(c.base); c.g.rotation.set(0, 0, 0); })
      .to(drop, { v: DROP_REST, duration: .8 }, '+=.2')
      .to(gantry.position, { z: GANTRY_HOME, duration: 1 }, '-=.3')
      .to(trolley.position, { x: 0, duration: 1 }, '<')
      .add(() => { busy = false; openIdx = -1; gsap.to('#bottom', { opacity: 1, y: 0, duration: .4 }); }, '-=.5');
  }

  /* ---------- Modal ---------- */
  const modal = $('#modal'), panel = $('#panel'), content = $('#content');
  let lastFocus = null;

  function showModal(i) {
    const s = SECTIONS[i];
    panel.style.setProperty('--acc', s.color);
    panel.style.setProperty('--acc-ui', s.ui);
    panel.style.setProperty('--head-ink', s.ink);
    $('#closeBtn').style.color = '#fff';
    $('#modalTitle').textContent = s.label;
    $('#modalCode').textContent = s.code;
    content.innerHTML = TEMPLATES[s.id]();
    content.scrollTop = 0;
    lastFocus = document.activeElement;
    modal.classList.add('open');
    gsap.to(modal, { opacity: 1, duration: .3 });
    gsap.fromTo(panel, { y: 70, scale: .94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: .6, ease: 'back.out(1.4)' });
    setTimeout(() => $('#closeBtn').focus({ preventScroll: true }), 50);
  }
  function hideModal() {
    gsap.to(panel, { y: 50, scale: .96, opacity: 0, duration: .35, ease: 'power2.in' });
    gsap.to(modal, { opacity: 0, duration: .35, onComplete: () => { modal.classList.remove('open'); content.innerHTML = ''; } });
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  $('#closeBtn').addEventListener('click', closeSection);
  modal.addEventListener('click', e => { if (e.target === modal) closeSection(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSection(); });

  content.addEventListener('click', e => {
    const v = e.target.closest('[data-yt]');
    if (!v) return;
    v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.dataset.yt}?autoplay=1&rel=0" title="Vídeo de campaña" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    v.removeAttribute('data-yt'); v.style.cursor = 'default';
  });
  content.addEventListener('click', async e => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.querySelector('span').textContent = 'Copiado'; }
    catch (err) { b.querySelector('span').textContent = 'Selecciona y copia'; }
    setTimeout(() => { const sp = b.querySelector('span'); if (sp) sp.textContent = 'Copiar'; }, 1800);
  });
  content.addEventListener('submit', async e => {
    if (e.target.id !== 'contactForm') return;
    e.preventDefault();
    const f = e.target, msg = $('#formMsg'), btn = $('#sendBtn');
    const val = n => (f.elements.namedItem(n).value || '').trim();
    const name = val('name'), email = val('email'), text = val('message');
    if (val('_honey')) return;
    if (!name || !text || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      msg.style.color = '#ffb4ae';
      msg.textContent = 'Completa tu nombre, un email válido y el mensaje.';
      return;
    }
    btn.disabled = true; btn.textContent = 'Enviando…'; msg.textContent = '';
    try {
      const r = await fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ nombre: name, email, mensaje: text,
          _subject: `Nuevo mensaje del portfolio: ${name}`, _replyto: email, _template: 'table', _captcha: 'false' }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || String(data.success) !== 'true') throw new Error(data.message || 'Error');
      msg.style.color = 'var(--acc-ui)';
      msg.textContent = 'Mensaje enviado. Gracias, te respondo pronto.';
      f.reset();
    } catch (err) {
      msg.style.color = '#ffb4ae';
      msg.innerHTML = 'No se pudo enviar ahora. Escríbeme a <a class="underline" href="mailto:ldrpaulette@gmail.com">ldrpaulette@gmail.com</a>.';
    } finally {
      btn.disabled = false; btn.textContent = 'Enviar mensaje';
    }
  });

  /* ---------- Bucle ---------- */
  const tmp = new THREE.Vector3(), tip3 = new THREE.Vector3(), cw = new THREE.Vector3();
  function tick(t) {
    camera.position.copy(camFocus).add(CAM_OFFSET);
    camera.lookAt(camFocus);

    cables.scale.y = drop.v;
    hook.position.y = -drop.v;
    hook.rotation.z = sway.v * .5 + Math.sin(t * .0013) * .015;

    if (attached) {
      hook.getWorldPosition(tmp);
      const c = attached.g;
      c.position.set(tmp.x, tmp.y - HANG, tmp.z);
      c.rotation.z = sway.v * .3;
      c.updateMatrixWorld();
      hook.localToWorld(tip3.set(0, HOOK_TIP, 0));
      const arr = rigGeo.attributes.position.array;
      corners.forEach((p, k) => {
        cw.copy(p); c.localToWorld(cw);
        arr.set([tip3.x, tip3.y, tip3.z, cw.x, cw.y, cw.z], k * 6);
      });
      rigGeo.attributes.position.needsUpdate = true;
    }

    beaconMat.emissiveIntensity = Math.sin(t * .006) > 0 ? 1.4 : .15;
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- Entrada ---------- */
  const loader = $('#loader');
  loader.style.opacity = 0;
  setTimeout(() => loader.remove(), 650);
  containers.forEach((c, k) => gsap.from(c.g.position, { y: c.base.y + 9, duration: .9, delay: .25 + k * .09, ease: 'bounce.out' }));
  gsap.from(gantry.position, { x: -40, duration: 1.4, ease: 'power3.out' });
  gsap.from('#bigword span', { opacity: 0, scale: .92, duration: 1.2, ease: 'power3.out' });
})();
</script>
</body>
</html>
